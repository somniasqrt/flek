name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - run: rustup show
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The app embeds ui/dist at compile time, so build the UI before clippy.
      - run: npm ci
      - run: npm run build --workspace ui
      - run: npm test --workspace ui
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
