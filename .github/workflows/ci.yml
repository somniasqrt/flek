name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects stable with rustfmt and clippy.
      - run: rustup show
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The app embeds ui/dist at compile time, so build the UI before clippy.
      - run: npm ci
      - run: npm run check --workspace ui
      - run: npm run build --workspace ui -- --configLoader runner
      - run: npm test --workspace ui
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all

  windows-installer:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup show
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-installer
      # Tauri merges tauri.windows.conf.json and builds the UI via its hook.
      # No signing credentials or release publishing: reviewable CI artifacts.
      - run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles msi,nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: flek-windows-x64-installers
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
