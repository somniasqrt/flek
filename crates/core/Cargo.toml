[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

