[package]
name = "flek-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "flek-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flek-core.workspace = true
anyhow.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile.workspace = true

# Only browsing_data::macos may call the native record-scoped WebKit API.
# Other app code still denies unsafe; core/CLI retain workspace forbid.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSSet"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebsiteDataStore", "WKWebsiteDataRecord", "block2"] }
block2 = "0.6"
